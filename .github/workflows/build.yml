name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  checks: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -E "^e: |error:|What went wrong|Missing class|Could not resolve|ERROR" -A6 build.log | head -200 > errors.txt || true
          [ -s errors.txt ] || tail -120 build.log > errors.txt
          msg=$(sed -e 's/%/%25/g' errors.txt | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Build failed::${msg}"
          if [ "${{ github.event_name }}" = "push" ]; then
            gh release delete ci-log --yes --cleanup-tag || true
            gh release create ci-log build.log errors.txt --prerelease --title "Last failed build log" \
              --notes "Build of ${GITHUB_SHA::7} failed. Deleted automatically on the next green build." --target "$GITHUB_SHA"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: aria-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish nightly release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk aria.apk
          gh release delete ci-log --yes --cleanup-tag || true
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly aria.apk --prerelease --title "Aria nightly (build ${GITHUB_RUN_NUMBER})" \
            --notes "Built from ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)" --target "$GITHUB_SHA"
