name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  checks: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history + tags, for release notes

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -E "^e: |error:|What went wrong|Missing class|Could not resolve|ERROR" -A6 build.log | head -200 > errors.txt || true
          [ -s errors.txt ] || tail -120 build.log > errors.txt
          msg=$(sed -e 's/%/%25/g' errors.txt | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Build failed::${msg}"
          if [ "${{ github.event_name }}" = "push" ]; then
            gh release delete ci-log --yes --cleanup-tag || true
            gh release create ci-log build.log errors.txt --prerelease --title "Last failed build log" \
              --notes "Build of ${GITHUB_SHA::7} failed. Deleted automatically on the next green build." --target "$GITHUB_SHA"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: aria-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.${GITHUB_RUN_NUMBER}"
          PREV=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          {
            echo "Install: download **aria.apk** below. It updates over any earlier build."
            echo
            echo "### Changes"
            if [ -n "$PREV" ]; then
              git log --no-merges --pretty='- %s' "$PREV..HEAD"
            else
              git log --no-merges --pretty='- %s' -n 20
            fi
          } > notes.md
          cp app/build/outputs/apk/release/app-release.apk aria.apk
          gh release delete ci-log --yes --cleanup-tag || true
          gh release delete nightly --yes --cleanup-tag || true
          gh release create "$TAG" aria.apk --title "Aria $TAG" --notes-file notes.md --target "$GITHUB_SHA" --latest
