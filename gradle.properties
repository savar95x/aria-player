org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 9 makes R8 stop implicitly keeping no-arg constructors of kept classes. Libraries that
# create classes by reflection rely on the old behaviour (it crashed WorkManager at start-up when
# the widget used Glance), so keep it until every reflective path has been checked.
android.r8.strictFullModeForKeepRules=false

# Release version: "<aria.version>.<CI run - aria.versionBase>", so the run after the bump is x.y.0.
# Bump aria.version (and set aria.versionBase to the next CI run number) for a new minor/major.
aria.version=1.0
aria.versionBase=51
